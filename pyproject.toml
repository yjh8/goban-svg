[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "goban-svg"
version = "0.1.1"
description = "Convert screenshots of Go board positions into clean SVG diagrams (pure stdlib, zero runtime deps)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
images = ["pillow"]

[project.scripts]
goban-svg = "goban_svg.cli:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[tool.hatch.build.targets.wheel]
packages = ["src/goban_svg"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
